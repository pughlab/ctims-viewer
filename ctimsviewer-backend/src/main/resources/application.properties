keycloak.auth-server-url=http://192.168.2.95:4000
keycloak.realm=Ctimsorg
keycloak.resource=ctims
keycloak.credentials.secret=authenticated
keycloak.use-resource-role-mappings=true
keycloak.public-client=true
keycloak.bearer-only=true
keycloak.ssl-required=external
keycloak.confidential-port=0
keycloak.principal-attribute=preferred_username
origins.allowed=http://localhost:3000


spring.servlet.multipart.maxFileSize=200MB
spring.servlet.multipart.maxRequestSize=200MB
logging.level.org.springframework.security=DEBUG
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://192.168.2.95:4000/realms/Ctimsorg
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

server.port=8080


spring.datasource.url=jdbc:mysql://localhost:3307/ctimsviewer
spring.datasource.username=root
spring.datasource.password=ctimsviewer

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
spring.datasource.hikari.connection-timeout=70000

MM_API_URL=http://localhost:5001/api
MM_API_TOKEN=<Token>




