keycloak.auth-server-url=https://demo-kc.ctims.ca
keycloak.realm=Ctimsorg
keycloak.resource=ctims
keycloak.credentials.secret=authenticated
keycloak.use-resource-role-mappings=true
keycloak.public-client=true
keycloak.bearer-only=true
keycloak.ssl-required=external
keycloak.confidential-port=0
keycloak.principal-attribute=preferred_username
origins.allowed=https://demo-viewer.ctims.ca
spring.servlet.multipart.maxFileSize=400MB
spring.servlet.multipart.maxRequestSize=1080MB
logging.level.org.springframework.security=DEBUG
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://demo-kc.ctims.ca/realms/Ctimsorg
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

server.port=9000


spring.datasource.url=jdbc:mysql://ctims-viewer-mysql:3306/ctimsviewer
spring.datasource.username=root
spring.datasource.password=ctimsviewer

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
spring.datasource.hikari.connection-timeout=70000

CTIMS_VIEWER_API_VERSION=3.1
MM_API_URL=http://mm-api:5000/api
MM_API_TOKEN=<Token>
MM_DB_URL=mongodb://mm_mongo_db:27017




