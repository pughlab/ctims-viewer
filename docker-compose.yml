version: '3.8'
services:
  frontend:
    container_name: ctims-viewer-frontend
    build:
      context: ctimsviewer-frontend
      dockerfile: Dockerfile
    ports:
      - "3030:3030"
    restart: always
    networks:
      - ctims-network
      
  backend:
    container_name: ctims-viewer-backend
    build:
      context: ctimsviewer-backend
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - JAVA_OPTS=-Dserver.port=9000
      - SPRING_PROFILES_ACTIVE=dev
    restart: always
    networks:
      - ctims-network
    volumes:
      - type: bind
        source: ./python_scripts/trial-match-utils/src
        target: /app/python_scripts
    depends_on:
          - mysql

  mysql:
    image: mysql:8
    container_name: ctims-viewer-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ctimsviewer
      MYSQL_DATABASE: ctimsviewer
      MYSQL_USER: ctimsviewer
      MYSQL_PASSWORD: ctimsviewer
    ports:
      - "3309:3309"
    volumes:
      - cv_mysql_data:/var/lib/mysql
    restart: always
    networks:
      - ctims-network

networks:
  ctims-network:
    external: true

volumes:
  cv_mysql_data: