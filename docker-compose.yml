version: '3.8'
services:
  frontend:
    build:
      context: ctimsviewer-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        REACT_APP_API_URL_DB: ${REACT_APP_API_URL_DB}
        REACT_APP_KEYCLOAK_INTEGRATION: ${REACT_APP_KEYCLOAK_INTEGRATION}
        REACT_APP_KEYCLOAK_URL: ${REACT_APP_KEYCLOAK_URL}
        REACT_APP_KEYCLOAK_CLIENT: ${REACT_APP_KEYCLOAK_CLIENT}
        REACT_APP_KEYCLOAK_REALM: ${REACT_APP_KEYCLOAK_REALM}
    env_file:
      - path: .env
    ports:
      - "3030:3030"
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}
      REACT_APP_KEYCLOAK_INTEGRATION: ${REACT_APP_KEYCLOAK_INTEGRATION}
      REACT_APP_KEYCLOAK_URL: ${REACT_APP_KEYCLOAK_URL}
      REACT_APP_KEYCLOAK_CLIENT: ${REACT_APP_KEYCLOAK_CLIENT}
      REACT_APP_KEYCLOAK_REALM: ${REACT_APP_KEYCLOAK_REALM}
    restart: always
    networks:
      - cv-network
      
  backend:
    build:
      context: ctimsviewer-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Dserver.port=8080
      - SPRING_PROFILES_ACTIVE=dev
    env_file:
      - path: ./.env
    restart: always
    networks:
      - cv-network
    volumes:
      - type: bind
        source: ./python_scripts/trial-match-utils/src
        target: /app/python_scripts

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ctimsviewer
      MYSQL_DATABASE: ctimsviewer
      MYSQL_USER: ctimsviewer
      MYSQL_PASSWORD: ctimsviewer
    ports:
      - "3306:3306"
    volumes:
      - cv_mysql_data:/var/lib/mysql
    restart: always
    networks:
      - cv-network

networks:
  cv-network:
    driver: bridge

volumes:
  cv_mysql_data: